<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <!-- BOOTSTRAP -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" />
</head>

<body>
    <button class="btn-cart" type="button" data-bs-toggle="offcanvas" data-bs-target="#carritoLateral"><i
            class="bi bi-cart"></i> </button>
    <div class="offcanvas offcanvas-end " id="carritoLateral" style="width: 500px">
        <div class="offcanvas-header">
            <h5 class="offcanvas-title">Pedidos</h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
        </div>
        <div class="offcanvas-body d-flex flex-column">
            <div id="listaCarrito">
                <div class="cart-item d-flex align-items-center" py="3" data-precio="20000" data-contida="1">
                    <div class="flex-grow-1">
                        <h6 class="mb-1"> Hamburguesa 200gr</h6>
                        <p class="mb-2 text-muted small">$18.900 c/u</p>
                        <div class="cantidad-selector">
                            <button class="btn-menos">−</button>
                            <span class="px-2" class="cantidad">1</span>
                            <button class="btn-mas">+</button>
                            <div>
                                <button class="btn-quitar - mb-2"> <i class="bi bi-trash3"></i></button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="pt-3 mt-2 border-top">
            <div class="d-flex justify-content-between mb-2">
                <span class="text-muted">Subtotal</span>
                <span id="subtotal" class="fw-semibold">$0</span>
            </div>
            <button class="btn btn-checkout w-100 text-white">Ir a pagar</button>
        </div>
    </div>
    <section class="HERO">
        <img src="" alt="" />
        <p></p>
    </section>

    <!-- SCRIPT DE BOOTSTRAP -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"
        defer></script>
</body>

</html>
