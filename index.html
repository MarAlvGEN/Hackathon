<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>

        <!-- BOOTSTRAP -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
        />
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
        />
        <link rel="stylesheet" href="styles.css" />
    </head>
    <body>
        <section class="burger-hero position-relative overflow-visible py-5">
            <div class="container py-lg-5">
                <div class="row align-items-center g-5">
                    <div class="col-12 col-lg-5 order-2 order-lg-1">
                        <div class="hero-content">
                            <h1 class="display-3 fw-bold text-dark mb-3">
                                <span
                                    class="d-block fst-italic fw-normal font-cursiva"
                                    >¡Comida rápida</span
                                >
                                A LOS MEJORES PRECIOS!
                            </h1>

                            <p
                                class="text-secondary-custom mb-3 fs-5 fw-bolder"
                            >
                                Disfruta de tus comidas favoritas con
                                ingredientes frescos y combos increíbles,
                                directo hasta tu puerta.
                            </p>

                            <div
                                class="mb-3 d-flex align-items-center justify-content-center"
                            >
                                <span
                                    class="d-block text-uppercase fw-bold fs-4"
                                    >¡Precios desde los
                                    <strong
                                        class="fw-bolder text-secondary-custom fs-1"
                                    >
                                        $5.000!</strong
                                    >
                                </span>
                            </div>

                            <div
                                class="d-flex w-100 align-items-center justify-content-center"
                            >
                                <a
                                    class="btn btn-dark text-secondary-custom rounded-pill px-5 py-4 fw-bold text-uppercase fs-6 btn-custom"
                                >
                                    ¡Ordenar ahora!
                                </a>
                            </div>
                        </div>
                    </div>

                    <!-- Derecha -->
                    <div
                        class="col-12 col-lg-7 order-1 order-lg-2 position-relative text-center"
                    >
                        <div class="burger-img-container">
                            <!-- La Hamburguesa PNG -->
                            <img
                                src="https://cdn.creazilla.com/cliparts/70467/burger-clipart-lg.png"
                                alt="Delicious Burger"
                                class="img-fluid burger-image"
                            />

                            <figcaption
                                class="burger-badge position-absolute rounded-circle d-flex flex-column justify-content-center align-items-center"
                            >
                                <span class="fs-4 fs-lg-1 fw-bolder"
                                    >¡SOLO POR HOY!</span
                                >
                            </figcaption>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- SCRIPT DE BOOTSTRAP -->
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"
            defer
        ></script>
    </body>
</html>
